current_waypoint: WP-03.4
current_objective: >
  Finalize partitioned historical persistence governance by aligning
  documentation and waypoint state with implemented deterministic Fidelity
  ingestion, canonical normalization, and persistence verification behavior.

in_scope_items:
  - Partitioned immutable history contracts for signals and base universe
  - Current authoritative output contracts under data/current
  - Append-only index governance for signal_index and universe_index artifacts
  - Persistence verification philosophy and fail-closed validation semantics
  - Waypoint and master-plan synchronization with committed Unit 1 scope
  - Deterministic commit-boundary governance for Unit 2 documentation alignment

out_of_scope_items:
  - Web scraping or automated provider acquisition logic
  - Machine learning and predictive modeling pipelines
  - Dashboards, UI, and external API serving layers
  - Database persistence and distributed deployment concerns
  - Portfolio construction, optimization, or execution logic
  - Sector, industry, factor, and theme benchmark overlays
  - DAG scheduling and workflow orchestration engines
  - Distributed workers, async orchestration, and runtime state machines
  - Autonomous runtime governance or recursive control loops
  - Runtime identity resolution implementation for ticker/corporate events

next_action: >
  Execute Unit 3 runtime evidence retention decision and staging under governed
  commit boundaries without mixing cleanup/deprecation scope.

architectural_boundaries:
  platform_boundary: >
    Security Intelligence Hub publishes authoritative intelligence datasets;
    portfolio managers are external consumers and remain out of scope.
  runtime_boundary: >
    Single-process, deterministic pipeline progression with no microservices,
    workflow engines, or runtime autonomous agents.
  data_boundary: >
    Run manifests, stage manifests, and artifact records are append-oriented
    lineage evidence and must preserve historical truth.
  provider_boundary: >
    Provider-specific semantics remain isolated in provider modules and are
    translated into canonical forms through explicit contracts.
  coverage_boundary: >
    Coverage domains are first-class metadata. Lack of StarMine coverage must
    not be interpreted as low security quality.
  market_cap_boundary: >
    Market-cap classification is snapshot-based normalization context, not
    immutable security metadata. Provider lineage must be preserved.
  snapshot_boundary: >
    Signal snapshots are append-only historical truth. No overwrite behavior is
    permitted for published run lineage records.
  terminology_boundary: >
    Canonical terms must retain deterministic, non-overlapping definitions
    across architecture, governance, and philosophy documentation.
  temporal_boundary: >
    Point-in-time semantics are mandatory. No retroactive mutation or future
    information leakage is permitted in snapshot or benchmark-relative records.
  observability_boundary: >
    Manifests describe execution outcomes and lineage. They do not orchestrate,
    schedule, retry, or recursively govern runtime execution.