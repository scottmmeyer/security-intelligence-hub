current_waypoint: WP-05C
current_objective: >
  Establish temporal snapshot architecture and foundational hardening: atomic
  current publication, snapshot registries, single-source registry governance,
  temporal validation hardening, replay mode detection, expanded coverage states,
  and freshness metadata.

in_scope_items:
  - Phase A: snapshot_date-partitioned replay history directories
  - Phase B: analytical_snapshot_registry.csv and replay_snapshot_registry.csv append registries
  - Phase C: atomic current publication via os.replace() with .tmp/ staging and cleanup
  - Phase D: single-source YAML registry governance — WP05B_REQUIRED_* constants removed; providers derive from registry
  - Phase E: temporal validation hardening — 5 new validators (duplicate registry, partial publication, freshness, mode consistency, history sync)
  - Phase F: ReplayMode enum (HISTORICAL_VALIDATION, CURRENT_RECOMMENDATION, FORWARD_SIMULATION); detect_replay_mode(); replay_mode in ReplaySelection, headers, and CSVs
  - Phase G: FAILED and STALE added to REPLAY_STATUS_ENUM
  - Phase H: current_snapshot_metadata.json freshness metadata written to data/current/
  - Phase I: test_wp05c_temporal_snapshot.py — 23 new tests (94 total, up from 71)
  - Phase J: governance docs updated (navigation_state.yaml, wdd_log.md)
  - UI: Snapshot Freshness panel added; replay_mode badge in status line; Phase A history path resolution

out_of_scope_items:
  - Full-universe and top-N stock return replay curves
  - Rebalance logic, ML ranking, database systems, and workflow orchestration
  - Intraday market-data ingestion, options, futures, or non-daily frequencies
  - Polished production dashboard implementation or design-system work
  - Machine learning and predictive modeling pipelines
  - Real-time API serving and dashboard deployment layers
  - Portfolio execution, optimization, and order routing logic
  - Distributed workers, async orchestration, and runtime state machines
  - Autonomous runtime governance or recursive control loops

next_action: >
  Plan WP-05D stock replay curve integration and top-N availability activation
  while preserving WP-05C temporal snapshot governance contracts.

architectural_boundaries:
  platform_boundary: >
    Security Intelligence Hub publishes authoritative intelligence datasets;
    portfolio managers are external consumers and remain out of scope.
  runtime_boundary: >
    Single-process, deterministic pipeline progression with no microservices,
    workflow engines, or runtime autonomous agents.
  data_boundary: >
    Run manifests, stage manifests, and artifact records are append-oriented
    lineage evidence and must preserve historical truth.
  provider_boundary: >
    Provider-specific semantics remain isolated in provider modules and are
    translated into canonical forms through explicit contracts.
  coverage_boundary: >
    Coverage domains are first-class metadata. Lack of StarMine coverage must
    not be interpreted as low security quality.
  market_cap_boundary: >
    Market-cap classification is snapshot-based normalization context, not
    immutable security metadata. Provider lineage must be preserved.
  snapshot_boundary: >
    Signal snapshots are append-only historical truth. No overwrite behavior is
    permitted for published run lineage records.
  replay_boundary: >
    Replay selection must use start-date analytical universe rows only. Future
    scores and revised snapshots cannot influence initial basket construction.
  benchmark_vehicle_boundary: >
    Benchmark baselines and investable vehicle alternatives are distinct
    contracts and cannot be conflated in registry definitions or UI semantics.
  ui_boundary: >
    Prototype UI reads deterministic replay contracts only and does not
    introduce backend services, databases, or authentication layers.
  terminology_boundary: >
    Canonical terms must retain deterministic, non-overlapping definitions
    across architecture, governance, and philosophy documentation.
  temporal_boundary: >
    Point-in-time semantics are mandatory. No retroactive mutation or future
    information leakage is permitted in snapshot or benchmark-relative records.
  observability_boundary: >
    Manifests describe execution outcomes and lineage. They do not orchestrate,
    schedule, retry, or recursively govern runtime execution.