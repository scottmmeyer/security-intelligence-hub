version: 1
description: >
  Maps yfinance country field values to geography classification for ADR domicile
  resolution and international security classification.

  Categories:
    US:                     United States listed and domiciled companies
    DEVELOPED_INTERNATIONAL: MSCI World ex-US developed market countries
    EMERGING_MARKETS:       MSCI Emerging Markets countries

  When a security has quote_type=ADR (or is otherwise known to be non-US),
  the country field from yfinance is resolved through this map to determine
  the correct geography for benchmark assignment.

  Countries not in this map resolve to geography=INTERNATIONAL with
  benchmark_confidence=LOW.

country_geography_map:
  # ── United States ──────────────────────────────────────────────────────────
  United States: US

  # ── MSCI Developed Markets (ex-US) ────────────────────────────────────────
