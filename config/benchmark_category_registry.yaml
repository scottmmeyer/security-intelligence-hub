  - benchmark_id: BM_INTL_LARGE_EAFE
    name: MSCI EAFE Index
    category: INTERNATIONAL_LARGE_ALL
    geography: INTERNATIONAL
    market_cap_bucket: LARGE
    industry_scope: ALL
    symbol_or_index: EFA
    benchmark_type: EQUITY_INDEX

  - benchmark_id: BM_INTL_MID_ACWI_EXUS
    name: MSCI ACWI Index
    category: INTERNATIONAL_MID_ALL
    geography: INTERNATIONAL
    market_cap_bucket: MID
    industry_scope: ALL
    symbol_or_index: ACWI
    benchmark_type: EQUITY_INDEX

  - benchmark_id: BM_INTL_SMALL_MSCI_SMALL
    name: MSCI Emerging Markets Index Proxy
    category: INTERNATIONAL_SMALL_ALL
    geography: INTERNATIONAL
    market_cap_bucket: SMALL
    industry_scope: ALL
    symbol_or_index: EEM
    benchmark_type: EQUITY_INDEX

  - benchmark_id: BM_INTL_MICRO_GLOBAL_SMALL
    name: MSCI Emerging Markets Index Proxy
    category: INTERNATIONAL_MICRO_ALL
    geography: INTERNATIONAL
    market_cap_bucket: MICRO
    industry_scope: ALL
    symbol_or_index: EEM
    benchmark_type: EQUITY_INDEX

