version: 1
description: >
  Canonical allocation hierarchy definition for SIH Allocation Intelligence.
  Asset Class is the primary (Level 1) dimension, following institutional portfolio
  construction practice. Each node defines its replay filter mapping, replay
  sophistication level, and dimension metadata.

  Key scheme: dot-notation — EQUITIES.US.MEGA.HYPER_MEGA
  Propagation: target_pct_of_total = product(target_pct_of_parent across ancestry chain)
  Sum invariant: each parent's children target_pct_of_parent must sum to 100.0 ±0.01

nodes:

  # ─── LEVEL 1: ASSET CLASSES ────────────────────────────────────────────────

  - key: EQUITIES
    label: "Equities"
    parent_key: null
    dimension_type: ASSET_CLASS
    allocation_category_type: EQUITY
    hierarchy_level: 1
    children:
      - EQUITIES.US
      - EQUITIES.INTERNATIONAL
      - EQUITIES.EMERGING_MARKETS
    replay_filter_mapping: {}
    replay_sophistication: HIGH

  - key: FIXED_INCOME
    label: "Fixed Income"
    parent_key: null
    dimension_type: ASSET_CLASS
    allocation_category_type: FIXED_INCOME
    hierarchy_level: 1
    children:
      - FIXED_INCOME.US
      - FIXED_INCOME.INTERNATIONAL
      - FIXED_INCOME.INFLATION_PROTECTED
    replay_filter_mapping: {}
    replay_sophistication: LOW

  - key: DIGITAL
    label: "Digital Assets"
    parent_key: null
    dimension_type: ASSET_CLASS
    allocation_category_type: DIGITAL
    hierarchy_level: 1
    children:
      - DIGITAL.BITCOIN
      - DIGITAL.ETHEREUM
      - DIGITAL.OTHER
    replay_filter_mapping: {}
    replay_sophistication: NONE

  - key: COMMODITIES
    label: "Commodities"
