    dimension_type: ASSET_CLASS
    allocation_category_type: COMMODITY
    hierarchy_level: 1
    children:
      - COMMODITIES.GOLD
      - COMMODITIES.ENERGY
      - COMMODITIES.BROAD_BASKET
