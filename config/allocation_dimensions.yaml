    replay_sophistication: NONE

  - key: CASH
    label: "Cash"
    parent_key: null
    dimension_type: ASSET_CLASS
    allocation_category_type: CASH
    hierarchy_level: 1
    children: []
    replay_filter_mapping: {}
    replay_sophistication: NONE

