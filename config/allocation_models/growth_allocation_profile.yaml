mandate_type: GROWTH
display_name: "Growth"
philosophy: >
  Equity-first orientation with reduced fixed income. Tilts toward small/mid cap
  for higher long-term growth potential. Emerging markets and international
  exposure increased relative to Balanced. Digital allocation doubled to reflect
  asymmetric growth potential. Drift tolerances are moderate with upside bias.

