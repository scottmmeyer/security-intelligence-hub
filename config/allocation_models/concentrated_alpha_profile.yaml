mandate_type: CONCENTRATED_ALPHA
display_name: "Concentrated Alpha"
philosophy: >
  Replay-driven, signal-driven, conviction-driven. High asymmetry tolerated.
  Small/mid/micro cap concentration tolerated — these are the return engines.
  Cash treated as dry powder, not idle drag. Fixed income optional; currently
  minimal. Mega cap targets reduced to reflect conviction in undervalued tiers.
  Emerging markets reduced in favor of domestic signal-rich opportunities.
  Drift tolerances are wide and asymmetric — overweight small/mid/micro is
  acceptable under this mandate.

