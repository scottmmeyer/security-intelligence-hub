  DIGITAL.BITCOIN: 0.6
  DIGITAL.ETHEREUM: 0.25
  DIGITAL.OTHER: 0.15
  COMMODITIES.GOLD: 2.5
  COMMODITIES.ENERGY: 1.0
  COMMODITIES.BROAD_BASKET: 0.5

  # Market cap level (depth 3)
  EQUITIES.US.MEGA: 16.0
