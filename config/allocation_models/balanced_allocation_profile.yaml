mandate_type: BALANCED
display_name: "Balanced"
philosophy: >
  Risk-managed diversification across equities, fixed income, and alternatives.
  Targets a ~60/30 equity/fixed-income split with modest digital and commodity
  exposure. Drift tolerances are symmetric and moderate.

nodes:
  # Asset class level (depth 1) — must sum to 100.0
  EQUITIES: 60.0
  FIXED_INCOME: 30.0
  DIGITAL: 1.0
  COMMODITIES: 4.0
  CASH: 5.0

  # Geography level (depth 2)
